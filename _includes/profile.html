<div class="profile-card">

  <h1>{{ site.author.name }}</h1>
  <p class="profile-role">{{ site.author.role }}</p>
  <div class="profile-meta"><div><span>LOCATION</span><p>{{ site.author.location }}</p></div><div><span>EMAIL</span><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></div></div>
  <nav class="section-nav" aria-label="CV sections"><span class="nav-caption">CONTENTS</span><a href="#profile"><i>01</i> Summary</a><a href="#experience"><i>02</i> Experience</a><a href="#education"><i>03</i> Education</a><a href="#skills"><i>04</i> Skills</a></nav>

</div>
